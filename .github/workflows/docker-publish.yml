name: Docker Build & Publish

on:
  push:
    branches:
      - v1
      - main
    tags:
      - 'v*.*.*'
      - 'v*'
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'docker-compose*.yml'
      - 'docker-compose*.yaml'
      - 'docker-compose*.env*'
      - '*.env'
      - '*.env.*'
  pull_request:
    branches:
      - v1
      - main
    paths-ignore:
      - 'docs/**'
      - '*.md'
      - '.gitignore'
      - 'docker-compose*.yml'
      - 'docker-compose*.yaml'
      - 'docker-compose*.env*'
      - '*.env'
      - '*.env.*'
  workflow_dispatch:
    inputs:
      platforms:
        description: '构建目标平台 (默认双架构；日常快速构建/预热缓存可填 linux/amd64)'
        required: false
        type: string
        default: 'linux/amd64,linux/arm64'
      push_image:
        description: '是否推送镜像到镜像仓库'
        required: true
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 检出源码
        uses: actions/checkout@v4

      - name: 设置 QEMU 跨平台仿真支持 (支持 amd64 / arm64)
        uses: docker/setup-qemu-action@v3

      - name: 设置 Docker Buildx 构建器
        uses: docker/setup-buildx-action@v3

      - name: 登录到 GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request' || github.event.inputs.push_image == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 登录到 Docker Hub (可选，若配置了对应 Secret)
        if: (github.event_name != 'pull_request' || github.event.inputs.push_image == 'true') && env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: 提取 Docker 镜像元数据与标签 (Metadata)
        id: meta
        uses: docker/metadata-action@v5 
        with:
          images: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
            ${{ secrets.DOCKERHUB_USERNAME && format('{0}/mpay', secrets.DOCKERHUB_USERNAME) || '' }}
          tags: |
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/v1' || github.ref == 'refs/heads/main' }}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-,format=short

      - name: 构建并推送 Docker 镜像
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ github.event.inputs.platforms || 'linux/amd64,linux/arm64' }}
          push: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache
            type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            type=gha,scope=build
            type=gha
          cache-to: ${{ github.event_name != 'pull_request' && (github.event.inputs.push_image != 'false') && format('type=registry,ref={0}/{1}:buildcache,mode=max', env.REGISTRY, env.IMAGE_NAME) || 'type=gha,mode=max,scope=build' }}
