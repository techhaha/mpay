map $request_uri $mpay_v1_path_info {
    ~^([^?]*) $1;
}

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    root /var/www/html/public;
    index index.php;

    client_max_body_size 10m;
    autoindex off;

    # 维护模式拦截
    if (-f /var/www/html/runtime/maintenance.flag) {
        return 503;
    }

    # 禁止访问敏感隐藏文件
    location ~ /\. {
        deny all;
    }

    # 上传目录只允许登记图片的静态后缀，不把上传内容交给 PHP，也不作为路由兜底
    location ~* ^/storage/.+\.(?:png|jpe?g|webp)$ {
        limit_except GET HEAD { deny all; }
        disable_symlinks on;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location /storage/ {
        return 404;
    }

    # 静态静态资源兜底与 URL 重写
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 易支付 .php 是协议路径，实际仍由显式 ThinkPHP 路由处理，不能当作任意磁盘脚本执行
    location ~ ^/(submit|mapi|api)\.php$ {
        rewrite ^ /index.php last;
    }

    # 只有固定前端控制器交给 PHP；PATH_INFO 保留原业务路径，避免重写后全部命中首页
    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root/index.php;
        fastcgi_param PATH_INFO $mpay_v1_path_info;
        fastcgi_read_timeout 65s;
        fastcgi_pass 127.0.0.1:9000;
    }

    # 拦截直接执行其他任何未授权的 .php 文件
    location ~* \.php(?:/|$) {
        return 404;
    }
}
