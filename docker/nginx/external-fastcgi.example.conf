# ==============================================================================
# MPAY 外部 Nginx + FastCGI 直连配置模板
# 适用于使用 CONTAINER_MODE=fpm-worker 或 CONTAINER_MODE=fpm 模式，
# 外部 Nginx 直接解析静态资源并通过 FastCGI (9000 端口) 转发 PHP 请求。
# 注意：外部 Nginx 所在的宿主机需要能够访问 MPAY 的 public/ 目录（如通过宿主机挂载目录）。
# ==============================================================================

map $request_uri $mpay_v1_path_info {
    ~^([^?]*) $1;
}

server {
    listen 80;
    server_name pay.yourdomain.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pay.yourdomain.com;

    # 替换为程序在宿主机上的 public 绝对路径
    root /path/to/mpay/public;
    index index.php;

    # SSL 证书配置
    ssl_certificate /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    client_max_body_size 10m;
    autoindex off;

    # 维护模式拦截
    if (-f /path/to/mpay/runtime/maintenance.flag) {
        return 503;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # 上传目录只允许登记图片的静态后缀，不执行 PHP
    location ~* ^/storage/.+\.(?:png|jpe?g|webp)$ {
        limit_except GET HEAD { deny all; }
        disable_symlinks on;
        add_header X-Content-Type-Options nosniff always;
        try_files $uri =404;
    }
    location /storage/ {
        return 404;
    }

    # 静态资源与 ThinkPHP 路由兜底
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # 易支付 .php 协议路径显式重写
    location ~ ^/(submit|mapi|api)\.php$ {
        rewrite ^ /index.php last;
    }

    # 仅入口文件转发给 Docker 内的 PHP-FPM（127.0.0.1:9000）
    location = /index.php {
        include fastcgi_params;
        # 容器内代码路径固定为 /var/www/html/public/index.php
        fastcgi_param SCRIPT_FILENAME /var/www/html/public/index.php;
        fastcgi_param PATH_INFO $mpay_v1_path_info;
        fastcgi_read_timeout 65s;
        # 代理到 Docker 容器映射出的 9000 端口
        fastcgi_pass 127.0.0.1:9000;
    }

    # 拦截其他磁盘 PHP 执行
    location ~* \.php(?:/|$) {
        return 404;
    }
}
