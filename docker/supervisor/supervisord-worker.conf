[supervisord]
nodaemon=true
user=root
logfile=/tmp/supervisord.log
pidfile=/tmp/supervisord.pid

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:payment-watch]
user=www-data
directory=/var/www/html
command=/usr/local/bin/worker-watch.sh
autostart=true
autorestart=true
priority=10
startsecs=3
startretries=3
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
umask=0077
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0

[program:payment-work]
user=www-data
directory=/var/www/html
command=/usr/local/bin/worker-work.sh
autostart=true
autorestart=true
priority=10
startsecs=3
startretries=3
stopsignal=TERM
stopwaitsecs=120
stopasgroup=true
killasgroup=true
umask=0077
redirect_stderr=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
