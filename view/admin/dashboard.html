{extend name="layouts/admin" /}
{block name="content"}
<section class="admin-intro"><h1>工作台</h1><div class="admin-actions"><button id="dashboard-refresh" type="button" class="layui-btn layui-btn-primary">刷新</button></div></section><div id="admin-feedback" class="admin-feedback" role="status" aria-live="polite"></div>
<section id="dashboard-setup" class="layui-card" hidden><div class="layui-card-header">开始收款</div><div class="layui-card-body admin-grid-equal"><div id="setup-channel"></div><div id="setup-application"></div></div></section>
<section class="layui-card"><div class="layui-card-body"><form id="dashboard-filter" class="layui-form admin-filters">
<label>统计日期<input name="date" class="layui-input" type="text" data-admin-date="date" value="{$date|htmlspecialchars}" placeholder="yyyy-MM-dd" pattern="[0-9]{4}-[0-9]{2}-[0-9]{2}" required></label>
<label>应用<select id="dashboard-app-filter" name="app_id" lay-search><option value="">全部应用</option></select></label>
<div class="admin-filter-buttons"><button type="submit" class="layui-btn">查询</button></div>
</form></div></section>
<div class="admin-metrics"><section class="admin-metric"><div class="admin-metric-title"><i class="layui-icon layui-icon-rmb admin-metric-icon " aria-hidden="true"></i>成功订单金额<button class="admin-help-button" type="button" data-help="按所选付款日期汇总成功订单的原金额。" aria-label="成功订单金额说明"><i class="layui-icon layui-icon-about" aria-hidden="true"></i></button></div><strong data-metric="business_amount">—</strong><small>元</small></section><section class="admin-metric"><div class="admin-metric-title"><i class="layui-icon layui-icon-ok-circle admin-metric-icon success" aria-hidden="true"></i>已确认实收<button class="admin-help-button" type="button" data-help="按付款日期汇总已确认实收，不重复累加到账流水或通知次数。" aria-label="已确认实收说明"><i class="layui-icon layui-icon-about" aria-hidden="true"></i></button></div><strong data-metric="received_amount">—</strong><small>元</small></section><section class="admin-metric"><div class="admin-metric-title"><i class="layui-icon layui-icon-form admin-metric-icon blue" aria-hidden="true"></i>创建订单数<button class="admin-help-button" type="button" data-help="统计所选日期创建的业务订单。" aria-label="创建订单数说明"><i class="layui-icon layui-icon-about" aria-hidden="true"></i></button></div><strong data-metric="created_orders">—</strong><small>笔</small></section><section class="admin-metric"><div class="admin-metric-title"><i class="layui-icon layui-icon-chart admin-metric-icon blue" aria-hidden="true"></i>创建订单成功率<button class="admin-help-button" type="button" data-help="所选日期创建的订单，截至当前已成功的比例。" aria-label="创建订单成功率说明"><i class="layui-icon layui-icon-about" aria-hidden="true"></i></button></div><strong data-metric="created_success_rate">—</strong><small>%</small></section></div>
<div class="admin-grid-equal admin-dashboard-panels">
<section class="layui-card"><div class="layui-card-header">待处理事项 <button class="admin-help-button" type="button" data-help="当前数量不受统计日期限制。商户通知按所选应用统计。" aria-label="待处理统计范围说明"><i class="layui-icon layui-icon-about" aria-hidden="true"></i></button></div><div class="layui-card-body" id="dashboard-queues"></div></section>
<section class="layui-card"><div class="layui-card-header">后台任务 <a class="admin-link" href="/admin/maintenance">查看运行详情</a></div><div class="layui-card-body" id="dashboard-workers"></div></section>
</div>
<details class="layui-card admin-details"><summary class="layui-card-header">更多统计</summary><div class="layui-card-body admin-stat-extra">
<span>实收与订单差额：<b data-metric="received_difference">—</b> 元</span><span>付款金额调整合计：<b data-metric="requested_offset">—</b> 元</span><span id="dashboard-other"></span>
</div></details><footer id="dashboard-observed"></footer>
{/block}
{block name="scripts"}<script src="/assets/js/admin-dashboard.js?v=20261009default-routing"></script>{/block}
