{extend name="layouts/base" /}
{block name="body_class"}auth-page{/block}
{block name="styles"}<link rel="stylesheet" href="/assets/css/admin.css?v=20261010classic">{/block}
{block name="content"}
<div class="admin-login">
    <header class="auth-brand"><img class="mpay-logo" src="/assets/brand/mpay-logo.svg" alt="MPAY 码支付" width="180"><p>让个人收款更加轻松便捷</p></header>
    <section class="layui-card admin-card">
        <div class="layui-card-body">
            <h1>登录管理后台</h1>
            <form id="admin-login-form" class="layui-form" data-admin-form="login">
                <div class="layui-form-item"><label for="username" class="admin-label">用户名</label>
                    <input id="username" name="username" class="layui-input" type="text" autocomplete="username" maxlength="64" required autofocus></div>
                <div class="layui-form-item"><label for="password" class="admin-label">密码</label>
                    <input id="password" name="password" class="layui-input" type="password" autocomplete="current-password" maxlength="72" required></div>
                <p id="admin-feedback" class="admin-feedback" role="status" aria-live="polite"></p>
                <button class="layui-btn admin-submit" type="submit">登录</button>
            </form>
        </div>
    </section>
</div>
{/block}
{block name="scripts"}{include file="admin/scripts" /}{/block}
