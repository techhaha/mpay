{extend name="layouts/admin" /}
{block name="content"}
<section class="admin-intro"><h1>交易订单</h1><div class="admin-actions"><button type="button" id="order-refresh" class="layui-btn layui-btn-primary" disabled>刷新</button><a id="order-notifications" class="layui-btn layui-btn-primary" href="/admin/notifications?all_dates=1">商户通知</a><button type="button" id="order-export" class="layui-btn layui-btn-primary">导出订单</button><button type="button" class="admin-help-button" data-help="导出使用当前筛选条件，单次最多 31 天、10000 条。日期按上海时区。" aria-label="订单导出说明">ⓘ</button></div></section>
<div id="admin-feedback" class="admin-feedback" role="status" aria-live="polite"></div>
<section class="layui-card"><div class="layui-card-body">
<form id="order-filters" class="layui-form admin-filter-panel" novalidate>
<div class="admin-filters">
<label>单号类型<select name="number_kind"><option value="merchant_order_no">商户订单号</option><option value="biz_no">业务单号</option><option value="pay_no">支付单号</option><option value="channel_order_no">渠道订单号</option><option value="channel_trade_no">渠道交易号</option></select></label>
<label>订单号<input name="number" class="layui-input" maxlength="128" placeholder="输入完整订单号"></label>
<label>应用<select name="app_id" id="order-app-filter" lay-search><option value="">全部应用</option></select></label>
<label>支付方式<select name="pay_type" data-payment-filter><option value="">全部方式</option></select></label>
<label>订单状态<select name="status">
    <option value="">全部状态</option>
    <optgroup label="支付状态">
        <option value="0">待发起支付</option>
        <option value="1">等待付款</option>
        <option value="paid_only">支付成功</option>
        <option value="2">支付成功（含退款）</option>
        <option value="3">支付失败</option>
        <option value="4">已关闭</option>
        <option value="5">已超时</option>
    </optgroup>
    <optgroup label="退款进度">
        <option value="refund_processing">退款处理中</option>
        <option value="refund_unknown">退款结果待核实</option>
        <option value="refund_partial">已部分退款</option>
        <option value="refund_full">已全部退款</option>
        <option value="refund_failed">退款未成功</option>
    </optgroup>
</select></label>
<label class="admin-date-filter">订单创建日期<span class="admin-date-range" data-date-range><input name="start_date" class="layui-input" value="{$start_date|htmlspecialchars}" placeholder="开始日期" aria-label="开始日期" autocomplete="off" readonly><span aria-hidden="true">—</span><input name="end_date" class="layui-input" value="{$end_date|htmlspecialchars}" placeholder="结束日期" aria-label="结束日期" autocomplete="off" readonly></span></label>
<div class="admin-filter-buttons"><button type="submit" class="layui-btn" disabled data-order-query>查询</button><button type="reset" class="layui-btn layui-btn-primary">重置</button></div>
</div>
<details class="admin-advanced"><summary>更多筛选</summary><div class="admin-filters">
<label>商户通知<select name="notification_status"><option value="">全部通知状态</option><option value="none">尚未生成通知</option><option value="0">等待发送 / 重试</option><option value="1">发送中</option><option value="2">最近通知成功</option><option value="3">停止自动重试</option><option value="4">暂不通知</option><option value="acknowledged">曾确认成功</option></select></label>
<label>下单 PID<input name="pid" class="layui-input" maxlength="32"></label>
<label>轮询组<select name="poll_group_id" lay-search><option value="">全部轮询组</option></select></label>
<label>收款通道<select name="channel_id" lay-search><option value="">全部通道</option></select></label>
</div></details></form>
<table id="order-table" lay-filter="order-table"></table>
</div></section>
{/block}
{block name="scripts"}<script src="/assets/js/admin-orders.js?v=20261028channelno"></script>{/block}
