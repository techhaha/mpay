{extend name="layouts/admin" /}
{block name="content"}
<section class="admin-intro"><h1>轮询组</h1><div class="admin-actions"><button id="groups-refresh" type="button" class="layui-btn layui-btn-primary">刷新</button><button id="groups-new" type="button" class="layui-btn">新增轮询组</button></div></section>
<div id="admin-feedback" class="admin-feedback" role="status" aria-live="polite"></div><section class="layui-card"><div class="layui-card-body">
<form id="groups-filters" class="layui-form admin-filters admin-filter-panel"><label>名称<input name="search" class="layui-input" placeholder="搜索轮询组"></label>
<label>支付方式<select name="pay_type" data-payment-filter><option value="">全部方式</option></select></label>
<label>策略<select name="route_mode"><option value="">全部策略</option><option value="1">顺序轮询</option><option value="2">权重随机</option><option value="3">默认优先</option></select></label>
<div class="admin-filter-buttons"><button type="submit" class="layui-btn">查询</button><button type="reset" class="layui-btn layui-btn-primary">重置</button></div></form>
<table id="groups-list" lay-filter="groups-list"></table><div id="groups-empty"></div>
</div></section>
{/block}
{block name="scripts"}<script src="/assets/js/admin-poll-groups.js?v=20261009default-routing"></script>{/block}
