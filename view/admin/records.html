{extend name="layouts/admin" /}
{block name="content"}
<section class="admin-intro"><h1>{$heading|htmlspecialchars}</h1><div class="admin-actions">{if $kind == 'notifications'}<a class="layui-btn layui-btn-primary" href="/admin/orders">返回交易订单</a>{elseif $kind == 'ingress'}<a class="layui-btn layui-btn-primary" href="/admin/maintenance">返回运行维护</a>{/if}<button type="button" class="layui-btn layui-btn-primary" id="records-refresh">刷新</button></div></section>
<div id="admin-feedback" class="admin-feedback" role="status" aria-live="polite"></div>
<section class="layui-card"><div class="layui-card-body">
<form id="records-filter" class="layui-form admin-filter-panel" data-kind="{$kind|htmlspecialchars}" novalidate>
<div class="admin-filters" id="records-main-filters">
<label class="admin-date-filter">日期范围 <button type="button" class="admin-help-button" id="records-date-help" aria-label="日期范围说明">ⓘ</button><span class="admin-date-range" data-date-range><input name="start_date" class="layui-input" value="{$start_date|htmlspecialchars}" placeholder="开始日期" aria-label="开始日期" autocomplete="off" readonly><span aria-hidden="true">—</span><input name="end_date" class="layui-input" value="{$end_date|htmlspecialchars}" placeholder="结束日期" aria-label="结束日期" autocomplete="off" readonly></span></label>
</div><details class="admin-advanced"><summary>更多筛选</summary><div class="admin-filters" id="records-advanced-filters"></div></details>
</form><table id="records-table" lay-filter="records-table"></table>
</div></section>
{/block}
{block name="scripts"}<script src="/assets/js/admin-records.js?v=20261012select"></script>{/block}
